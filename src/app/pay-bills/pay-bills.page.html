<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Pay Bills</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card class="pay-bills-card">
    <ion-card-header>
      <ion-card-title>Pay Bills</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Biller ID</ion-label>
        <ion-input [(ngModel)]="bill.biller_id" type="number"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Amount</ion-label>
        <ion-input [(ngModel)]="bill.amount" type="number"></ion-input>
      </ion-item>
      <ion-button expand="full" color="success" (click)="payBill()">Pay Bill</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
