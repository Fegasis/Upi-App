<ion-header>
  <ion-toolbar color="primary">
    <ion-title>PaymentApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Welcome to PaymentApp</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p>Experience seamless and secure transactions with our app.</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="6">
        <ion-button expand="block" color="secondary" routerLink="/login">
          <ion-icon slot="start" name="log-in-outline"></ion-icon>
          Login
        </ion-button>
      </ion-col>
      <ion-col size="6">
        <ion-button expand="block" color="tertiary" routerLink="/register">
          <ion-icon slot="start" name="person-add-outline"></ion-icon>
          Register
        </ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Quick Actions</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-grid>
              <ion-row>
                <ion-col size="6">
                  <ion-button expand="block" color="success" routerLink="/send-money">
                    <ion-icon slot="start" name="wallet-outline"></ion-icon>
                    Send Money
                  </ion-button>
                </ion-col>
                <ion-col size="6">
                  <ion-button expand="block" color="warning" routerLink="/request-money">
                    <ion-icon slot="start" name="cash-outline"></ion-icon>
                    Request Money
                  </ion-button>
                </ion-col>
              </ion-row>
              <ion-row>
                <ion-col size="6">
                  <ion-button expand="block" color="danger" routerLink="/pay-bills">
                    <ion-icon slot="start" name="card-outline"></ion-icon>
                    Pay Bills
                  </ion-button>
                </ion-col>
                <ion-col size="6">
                  <ion-button expand="block" color="dark" routerLink="/profile">
                    <ion-icon slot="start" name="person-circle-outline"></ion-icon>
                    Profile
                  </ion-button>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
