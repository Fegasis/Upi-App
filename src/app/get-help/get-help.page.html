<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Get Help</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Contact Support</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label position="stacked">Your Message</ion-label>
          <ion-textarea [(ngModel)]="help.message"></ion-textarea>
        </ion-item>
      </ion-list>
      <ion-button expand="full" color="success" (click)="sendHelpRequest()">Send</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
