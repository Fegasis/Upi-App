<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="login-header">
    <img src="https://iconscout.com/icon/transactions-8237300" alt="App Logo" class="logo">
    <h2>Welcome Back!</h2>
    <p>Please login to continue</p>
  </div>

  <ion-card>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input [(ngModel)]="credentials.email" type="email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Password</ion-label>
        <ion-input [(ngModel)]="credentials.password" type="password"></ion-input>
      </ion-item>
      <ion-button expand="full" color="success" (click)="login()">Login</ion-button>
    </ion-card-content>
  </ion-card>

  <div class="login-footer">
    <p>Don't have an account? <a routerLink="/register">Register here</a></p>
  </div>
</ion-content>
