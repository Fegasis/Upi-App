<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="profile-header">
    <div class="profile-avatar-container">
      <ion-avatar class="profile-avatar">
        <img [src]="'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png'" alt="Profile Picture">
      </ion-avatar>
      <ion-button fill="clear" class="profile-picture-button" (click)="triggerFileInput()">
        <ion-icon name="add-circle" size="large"></ion-icon>
      </ion-button>
      <input type="file" (change)="uploadProfilePicture($event)" class="profile-picture-upload" #fileInput>
    </div>
    <div class="profile-info">
      <h2>{{ profile_data?.name }}</h2>
      <p>{{ profile_data?.email }}</p>
    </div>
  </div>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Profile Information</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label position="stacked">Name</ion-label>
          <p>{{profile_data?.name}}</p>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Email</ion-label>
          <p>{{profile_data?.email}}</p>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Phone Number</ion-label>
          <p>{{profile_data?.phone_number}}</p>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Address</ion-label>
          <p>{{profile_data?.address}}</p>
        </ion-item>
      </ion-list>
      <!-- <ion-button expand="full" color="success" (click)="updateProfile()">Update Profile</ion-button> -->
    </ion-card-content>
  </ion-card>

  <!-- New Options -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Additional Options</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item button (click)="navigateTo('/pay-using-cards')">
          <ion-label>Pay with Debit or Credit Card</ion-label>
        </ion-item>
        <ion-item button (click)="navigateTo('settings')">
          <ion-label>Settings</ion-label>
        </ion-item>
        <ion-item button (click)="navigateTo('help')">
          <ion-label>Get Help</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
