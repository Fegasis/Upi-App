<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Pay with Debit or Credit Card</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Payment Information</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label position="stacked">Card Number</ion-label>
          <ion-input [(ngModel)]="payment.card_number" type="text"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Expiry Date</ion-label>
          <ion-input [(ngModel)]="payment.expiry_date" type="text"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">CVV</ion-label>
          <ion-input [(ngModel)]="payment.cvv" type="text"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Cardholder Name</ion-label>
          <ion-input [(ngModel)]="payment.cardholder_name" type="text"></ion-input>
        </ion-item>
      </ion-list>
      <ion-button expand="full" color="success" (click)="processPayment()">Pay Now</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
