  <ion-list>
    <ion-list-header>
      <ion-label>Transaction History</ion-label>
    </ion-list-header>
    <ion-item *ngFor="let transaction of transactions">
      <ion-icon name="cash-outline" slot="start"></ion-icon>
      <ion-label>
        <h2>Transaction ID: {{ transaction.TRANSACTION_ID }}</h2>
        <p>Amount: ₹{{ transaction.AMOUNT }}</p>
        <p>Date: {{ transaction.TRANSACTION_DATE }}</p>
